name: Publish Package to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-n-publish:
    name: Build and Publish PyHealth Package
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Mandatory for Trusted Publishing (OIDC)

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Verify package distribution artifacts
        run: |
          twine check dist/*

      # TestPyPI Publishing Step (Optional / Manual Trigger)
      # Uncomment below to publish to TestPyPI first:
      # - name: Publish distribution to TestPyPI
      #   uses: pypa/gh-action-pypa-publisher@release/v1
      #   with:
      #     repository-url: https://test.pypi.org/legacy/

      # PyPI Publishing via Trusted Publishing (OIDC)
      # Uncomment below for production PyPI release upon v2.0.0 tag push:
      # - name: Publish distribution to PyPI
      #   uses: pypa/gh-action-pypa-publisher@release/v1
