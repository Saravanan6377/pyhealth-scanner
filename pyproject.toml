[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyhealth-scanner"
version = "2.0.0"
description = "PyHealth Scanner — A unified Python project health analyzer CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = [
    "code quality",
    "static analysis",
    "project health",
    "linting",
    "security",
    "developer tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "ruff>=0.5",
    "bandit>=1.7",
    "radon>=6.0",
    "pip-audit>=2.6",
    "jinja2>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "build>=1.0",
    "twine>=7.0",
]

[project.scripts]
pyhealth = "pyhealth.cli:app"

[project.urls]
Homepage = "https://github.com/Saravanan6377/pyhealth-scanner"
Repository = "https://github.com/Saravanan6377/pyhealth-scanner"
Issues = "https://github.com/Saravanan6377/pyhealth-scanner/issues"
Changelog = "https://github.com/Saravanan6377/pyhealth-scanner/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["pyhealth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["pyhealth"]
